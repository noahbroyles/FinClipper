# Check the web UI, then build the FinClipper Docker image and publish it to
# the GitHub Container Registry (ghcr.io/<owner>/<repo>, lowercased).
#
# - Every run first type checks, tests and builds the web UI in frontend/.
#   The image is only built (and published) if that succeeds.
# - Pushes to the default branch publish "latest", the branch name and the
#   short commit SHA.
# - Version tags (v1.2.3) publish "1.2.3", "1.2" and "1".
# - Pull requests only build the image to check that it still builds; nothing
#   is pushed.
#
# Third party actions are pinned to full commit SHAs (version in the comment)
# because this workflow holds a token that can publish packages.
name: Docker image

on:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

# Cancel an older run for the same branch or PR when a newer one starts.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # The Docker build below also bundles the web UI, but bundling does not
  # check types, so a type error would otherwise go unnoticed.
  frontend:
    runs-on: ubuntu-latest
    # This job runs code from the repository (and from pull requests), so
    # it gets no permission to publish packages.
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same bun release line as the Dockerfile's oven/bun image.
      - name: Set up bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.x"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run the tests
        run: bun test

      - name: Build
        run: bun run build

  build:
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # QEMU lets the amd64 runner build the arm64 image as well.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Pull requests never push, so they do not need to log in. This
      # also keeps the token away from code in pull requests from forks.
      - name: Log in to the GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Works out the image tags and the OCI labels. The source label
      # links the published package to this repository on GitHub.
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          # Reuse layers from earlier runs (the apt install of ffmpeg
          # is the slow part, especially for arm64 under QEMU).
          cache-from: type=gha
          cache-to: type=gha,mode=max
