<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}FinClipper{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ version }}">
</head>
{# data-base lets the scripts build URLs that still work behind a path prefix. #}
<body data-base="{{ url_for('views.index') }}">
{% block body %}{% endblock %}
</body>
</html>
